
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <header class="page-header">
            <p class="eyebrow">PERSONAL FINANCE</p>
            <h1>Budget Tracker</h1>
            <p class="subtitle">Manage your expenses. Make every shilling count.</p>
        </header>

        <section class="card">
            <h2>Add Expense</h2>
            <p class="section-description">Record a new expense below.</p>

            <form id="expense-form">
                <div class="form-group">
                    <label for="expense-name">Expense Name</label>
                    <input type="text" id="expense-name" name="expense-name"
                           placeholder="e.g. Transport" required>
                </div>

                <div class="form-group">
                    <label for="expense-amount">Amount (KSh)</label>
                    <input type="number" id="expense-amount" name="expense-amount"
                           placeholder="e.g. 500" min="0.01" step="0.01" required>
                </div>

                <div class="form-group">
                    <label for="expense-category">Category</label>
                    <select id="expense-category" name="expense-category" required>
                        <option value="">Choose a category</option>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Education">Education</option>
                        <option value="Bills">Bills</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="expense-date">Date</label>
                    <input type="date" id="expense-date" name="expense-date" required>
                </div>

                <button type="submit" class="btn-primary">+ Add Expense</button>
            </form>
        </section>

        <section class="card expense-card">
            <div class="table-heading">
                <div>
                    <h2>Expense Table</h2>
                    <p class="section-description">Review your recorded expenses.</p>
                </div>
            </div>

            <div class="table-wrapper">
                <table id="expense-table">
                    <thead>
                        <tr>
                            <th>Expense Name</th>
                            <th>Amount</th>
                            <th>Category</th>
                            <th>Date</th>
                        </tr>
                    </thead>
                    <tbody id="expense-list">
                        <!-- Your existing JavaScript can populate expense rows here. -->
                    </tbody>
                </table>
            </div>
        </section>

        <footer>
            <p>Budget Tracker &copy; 2026 | Manage your money wisely.</p>
        </footer>
    </main>

    <!-- Keep your existing JavaScript here or link your existing script file. -->
</body>
</html>
